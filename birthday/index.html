<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A Birthday Surprise For You 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --rose:#FF4D8D;
    --violet:#7B3FE4;
    --gold:#FFC94D;
    --peach:#FFB199;
    --mint:#4DE8C0;
    --ink:#2E1F45;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    width:100%; height:100%;
    overflow:hidden;
    font-family:'Nunito', sans-serif;
  }
  body{
    position:relative;
    min-height:100vh;
  }

  .bg{
    position:fixed; inset:0;
    z-index:0;
    transition: background 1.4s ease;
    background: radial-gradient(circle at 30% 20%, #6A3DE8 0%, #3A1D6E 55%, #1C0E38 100%);
  }
  body.scene-cake .bg{
    background: radial-gradient(circle at 50% 30%, #FF7DA8 0%, #B23A6E 55%, #4A123F 100%);
  }
  body.scene-final .bg{
    background: radial-gradient(circle at 50% 40%, #FFD98A 0%, #FF8FAE 55%, #7B3FE4 100%);
  }

  /* floating ambient particles */
  .particles{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .particle{
    position:absolute;
    bottom:-40px;
    border-radius:50%;
    opacity:0.7;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{ transform: translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.8; }
    100%{ transform: translateY(-115vh) translateX(var(--drift,20px)) rotate(320deg); opacity:0; }
  }

  .stage{
    position:relative;
    z-index:2;
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .scene{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:24px;
    opacity:0;
    pointer-events:none;
    transition: opacity 1.2s ease;
  }
  .scene.visible{
    opacity:1;
    pointer-events:auto;
  }

  /* ---------------- Scene 1: Opening ---------------- */
  #scene-opening h1{
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    color:#fff;
    font-size:clamp(30px, 7vw, 62px);
    text-shadow: 0 6px 30px rgba(0,0,0,0.35);
    opacity:0;
    transform: translateY(24px) scale(0.92);
    animation: titleIn 1.3s cubic-bezier(.2,.9,.25,1) forwards;
    animation-delay: 0.3s;
  }
  #scene-opening .sub{
    margin-top:16px;
    color:#F4EBFF;
    font-size:clamp(14px, 3vw, 18px);
    font-weight:600;
    opacity:0;
    animation: fadeUp 1s ease forwards;
    animation-delay: 1.3s;
  }
  @keyframes titleIn{
    0%{ opacity:0; transform: translateY(24px) scale(0.92); }
    60%{ opacity:1; transform: translateY(-4px) scale(1.03); }
    100%{ opacity:1; transform: translateY(0) scale(1); }
  }
  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .glow-ring{
    position:absolute;
    width:340px; height:340px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,201,77,0.35) 0%, transparent 70%);
    z-index:-1;
    animation: pulseGlow 3.5s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%,100%{ transform: scale(1); opacity:0.7; }
    50%{ transform: scale(1.25); opacity:1; }
  }

  /* ---------------- Scene 2: Cake ---------------- */
  #scene-cake h2{
    font-family:'Fredoka', sans-serif;
    color:#fff;
    font-size:clamp(20px, 4.5vw, 30px);
    margin-bottom:26px;
    text-shadow: 0 4px 18px rgba(0,0,0,0.3);
    opacity:0;
    animation: fadeUp 1s ease forwards;
    animation-delay:0.2s;
  }
  .table{
    width:min(78vw, 360px);
    height:22px;
    background: linear-gradient(180deg, #B9713C, #8A4E27);
    border-radius:10px 10px 4px 4px;
    box-shadow: 0 18px 30px rgba(0,0,0,0.35);
    position:relative;
    margin-top:14px;
    transform: scaleX(0.7);
    opacity:0;
    animation: tableIn 0.8s ease forwards;
    animation-delay: 0.5s;
  }
  @keyframes tableIn{
    to{ opacity:1; transform: scaleX(1); }
  }

  .cake-wrap{
    position:relative;
    display:flex;
    flex-direction:column-reverse;
    align-items:center;
    transform: translateY(30px) scale(0.6);
    opacity:0;
    animation: cakeRise 1.2s cubic-bezier(.2,.9,.25,1) forwards;
    animation-delay: 0.9s;
    margin-bottom:-4px;
  }
  @keyframes cakeRise{
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  .tier{
    border-radius:10px;
    position:relative;
    box-shadow: inset 0 -6px 10px rgba(0,0,0,0.12);
  }
  .tier.base{
    width:200px; height:64px;
    background: linear-gradient(180deg, #FFD9E6, #FF9EC0);
  }
  .tier.mid{
    width:150px; height:52px;
    background: linear-gradient(180deg, #FFF0B8, #FFCF6B);
    margin-bottom:-8px;
  }
  .tier.top{
    width:104px; height:42px;
    background: linear-gradient(180deg, #D8C4FF, #A97DF2);
    margin-bottom:-8px;
  }
  .drip{
    position:absolute;
    top:-10px; left:0; right:0;
    height:16px;
    background: repeating-radial-gradient( circle at 10px 0, #fff 0 6px, transparent 7px 20px );
    opacity:0.9;
  }
  .candle{
    position:absolute;
    bottom:100%;
    width:6px;
    height:34px;
    background: linear-gradient(180deg, #FFF6D9, #FFD766);
    border-radius:3px;
    opacity:0;
    animation: candleIn 0.5s ease forwards;
  }
  .candle .flame{
    position:absolute;
    top:-14px; left:50%;
    transform: translateX(-50%);
    width:9px; height:16px;
    background: radial-gradient(circle at 50% 70%, #FFF3B0 0%, #FFB23C 55%, #FF6A3C 100%);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    animation: flicker 0.9s ease-in-out infinite;
    filter: drop-shadow(0 0 6px rgba(255,180,60,0.8));
  }
  @keyframes flicker{
    0%,100%{ transform: translateX(-50%) scale(1) rotate(-2deg); }
    50%{ transform: translateX(-50%) scale(1.12) rotate(3deg); }
  }
  @keyframes candleIn{
    to{ opacity:1; }
  }
  .candle.c1{ left:35px; animation-delay:1.8s; }
  .candle.c2{ left:52px; animation-delay:2.1s; }
  .candle.c3{ left:69px; animation-delay:2.4s; }

  .cherry{
    position:absolute;
    top:-8px; right:14px;
    width:14px; height:14px;
    background: radial-gradient(circle at 35% 30%, #FF8B9E, #E8264F);
    border-radius:50%;
    opacity:0;
    animation: candleIn 0.5s ease forwards;
    animation-delay: 1.6s;
  }

  .sparkle{
    position:absolute;
    width:6px; height:6px;
    background:#FFF7CC;
    border-radius:50%;
    opacity:0;
    animation: sparkle 1.6s ease-in-out infinite;
  }
  @keyframes sparkle{
    0%,100%{ opacity:0; transform: scale(0.4); }
    50%{ opacity:1; transform: scale(1.3); }
  }

  /* ---------------- Scene 3: Final hug illustration ---------------- */
  #scene-final h2{
    font-family:'Fredoka', sans-serif;
    color:#3A1D46;
    font-size:clamp(20px, 4.5vw, 30px);
    margin-bottom:6px;
    opacity:0;
    animation: fadeUp 1s ease forwards;
    animation-delay: 1.7s;
  }
  #scene-final p{
    color:#5B3F63;
    font-weight:700;
    font-size:clamp(13px, 3vw, 16px);
    max-width:420px;
    margin-top:10px;
    opacity:0;
    animation: fadeUp 1s ease forwards;
    animation-delay: 2.1s;
  }
  .hug-wrap{
    position:relative;
    width:min(70vw, 260px);
    opacity:0;
    transform: scale(0.85);
    animation: hugIn 1.2s cubic-bezier(.2,.9,.25,1) forwards;
    animation-delay:0.3s;
  }
  @keyframes hugIn{
    to{ opacity:1; transform: scale(1); }
  }
  .heart-pop{
    position:absolute;
    top:-6px; left:50%;
    transform: translateX(-50%);
    font-size:26px;
    opacity:0;
    animation: heartPop 1.6s ease-in-out infinite;
    animation-delay: 1.4s;
  }
  @keyframes heartPop{
    0%{ opacity:0; transform: translateX(-50%) translateY(6px) scale(0.7); }
    30%{ opacity:1; transform: translateX(-50%) translateY(-6px) scale(1.1); }
    60%{ opacity:1; transform: translateX(-50%) translateY(-14px) scale(1); }
    100%{ opacity:0; transform: translateX(-50%) translateY(-26px) scale(0.8); }
  }

  .replay-btn{
    margin-top:24px;
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:14px;
    color:#fff;
    background: linear-gradient(120deg, var(--rose), var(--violet));
    border:none;
    border-radius:999px;
    padding:12px 26px;
    cursor:pointer;
    box-shadow: 0 10px 22px rgba(123,63,228,0.35);
    opacity:0;
    animation: fadeUp 1s ease forwards;
    animation-delay: 2.5s;
    transition: transform 0.15s ease;
  }
  .replay-btn:active{ transform: scale(0.97); }

  .skip-btn{
    position:fixed;
    bottom:18px; right:18px;
    z-index:5;
    background: rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.35);
    color:#fff;
    font-family:'Nunito', sans-serif;
    font-size:12px;
    font-weight:700;
    border-radius:999px;
    padding:8px 16px;
    cursor:pointer;
    backdrop-filter: blur(4px);
  }
</style>
</head>
<body class="scene-opening">

  <div class="bg"></div>
  <div class="particles" id="particles"></div>

  <div class="stage">

    <!-- Scene 1: Opening message -->
    <section class="scene visible" id="scene-opening">
      <div class="glow-ring"></div>
      <h1>Happy Birthday,<br>My Friend! 🎉</h1>
      <div class="sub">a little surprise is on its way...</div>
    </section>

    <!-- Scene 2: Cake -->
    <section class="scene" id="scene-cake">
      <h2>Let's light your candles 🎂</h2>
      <div style="position:relative;">
        <div class="cake-wrap">
          <div class="tier base">
            <div class="candle c1"><div class="flame"></div></div>
            <div class="candle c2"><div class="flame"></div></div>
            <div class="candle c3"><div class="flame"></div></div>
          </div>
          <div class="tier mid"><div class="drip"></div></div>
          <div class="tier top">
            <div class="drip"></div>
            <div class="cherry"></div>
          </div>
        </div>
        <div class="sparkle" style="top:-10px; left:10px; animation-delay:2.6s;"></div>
        <div class="sparkle" style="top:20px; right:-6px; animation-delay:3s;"></div>
        <div class="sparkle" style="bottom:40px; left:-14px; animation-delay:3.4s;"></div>
      </div>
      <div class="table"></div>
    </section>

    <!-- Scene 3: Final hug -->
    <section class="scene" id="scene-final">
      <div class="hug-wrap">
        <span class="heart-pop">💛</span>
        <svg viewBox="0 0 260 220" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="130" cy="205" rx="95" ry="12" fill="#7B3FE4" opacity="0.12"/>
          <!-- friend 1 -->
          <g>
            <path d="M60 210 C55 150 60 110 95 95 C112 88 118 70 108 55 C120 45 145 48 150 68 C158 90 145 105 128 112 C150 130 155 165 150 210 Z" fill="#FF8FAE"/>
            <circle cx="103" cy="60" r="26" fill="#FFD9B3"/>
            <path d="M80 52 C82 32 124 30 128 52 C132 40 116 30 103 32 C90 34 78 40 80 52 Z" fill="#5B3A2E"/>
          </g>
          <!-- friend 2 -->
          <g>
            <path d="M200 210 C206 150 200 110 165 95 C148 88 142 70 152 55 C140 45 115 48 110 68 C102 90 115 105 132 112 C110 130 105 165 110 210 Z" fill="#7B3FE4"/>
            <circle cx="157" cy="60" r="26" fill="#F2C49B"/>
            <path d="M133 55 C130 34 186 34 182 56 C186 46 176 36 157 36 C140 36 130 44 133 55 Z" fill="#2E1F1A"/>
          </g>
          <!-- arms hugging -->
          <path d="M112 95 C130 118 130 118 148 95" stroke="#FFD9B3" stroke-width="12" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <h2>Here's to another beautiful year 🎈</h2>
      <p>Wishing you endless laughter, good health, and moments as bright as this one — Happy Birthday!</p>
      <button class="replay-btn" onclick="restart()">Watch it again ↻</button>
    </section>

  </div>

  <button class="skip-btn" onclick="skipToFinal()">Skip ⏭</button>

<script>
  const body = document.body;
  const sceneOpening = document.getElementById('scene-opening');
  const sceneCake = document.getElementById('scene-cake');
  const sceneFinal = document.getElementById('scene-final');
  let timers = [];

  function clearTimers(){
    timers.forEach(t => clearTimeout(t));
    timers = [];
  }

  function showScene(el, bodyClass){
    document.querySelectorAll('.scene').forEach(s => s.classList.remove('visible'));
    el.classList.add('visible');
    body.className = bodyClass;
  }

  function runSequence(){
    clearTimers();
    showScene(sceneOpening, 'scene-opening');
    timers.push(setTimeout(() => showScene(sceneCake, 'scene-cake'), 4200));
    timers.push(setTimeout(() => showScene(sceneFinal, 'scene-final'), 9600));
  }

  function skipToFinal(){
    clearTimers();
    showScene(sceneFinal, 'scene-final');
  }

  function restart(){
    // restart CSS animations by forcing reflow on scenes
    [sceneOpening, sceneCake, sceneFinal].forEach(s => {
      s.querySelectorAll('*').forEach(el => {
        el.style.animation = 'none';
        void el.offsetWidth;
        el.style.animation = '';
      });
    });
    runSequence();
  }

  // Ambient floating particles (confetti/hearts)
  function spawnParticles(){
    const wrap = document.getElementById('particles');
    const shapes = ['💛','✨','🎈','💫'];
    for (let i = 0; i < 18; i++){
      const p = document.createElement('div');
      const isEmoji = Math.random() > 0.4;
      const left = Math.random() * 100;
      const duration = 9 + Math.random() * 8;
      const delay = Math.random() * 10;
      const drift = (Math.random() * 80 - 40) + 'px';
      p.style.left = left + 'vw';
      p.style.setProperty('--drift', drift);
      p.style.animationDuration = duration + 's';
      p.style.animationDelay = delay + 's';
      if (isEmoji){
        p.textContent = shapes[Math.floor(Math.random() * shapes.length)];
        p.style.fontSize = (14 + Math.random() * 12) + 'px';
        p.className = 'particle';
        p.style.background = 'none';
      } else {
        p.className = 'particle';
        const size = 6 + Math.random() * 8;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        const colors = ['#FFD766','#FF8FAE','#B39CFF','#7EE8C8'];
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
      }
      wrap.appendChild(p);
    }
  }

  spawnParticles();
  runSequence();
</script>
</body>
</html>
